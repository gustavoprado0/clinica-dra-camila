services:
  - type: web
    name: clinica-dra-camila-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: bash -c "npx prisma migrate deploy || (sleep 5 && npx prisma migrate deploy) || (sleep 10 && npx prisma migrate deploy); npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
