services:
  - type: web
    name: clinica-dra-camila-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: clinica-dra-camila-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false

databases:
  - name: clinica-dra-camila-db
    plan: free
    region: oregon
    databaseName: clinica_camila
    user: postgres
