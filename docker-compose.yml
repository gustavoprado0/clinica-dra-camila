services:
  postgres:
    image: postgres:16-alpine
    container_name: clinica_camila_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clinica_camila
    ports:
      - "5432:5432"
    volumes:
      - clinica_camila_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clinica_camila"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  clinica_camila_pgdata:
